<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoSport - Blog de Carros Esportivos</title>
  <style>
    :root {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #e50914;
      --subtext-color: #aaa;
      --border-color: #333;
      --font-scale: 1;
    }

    /* Classe aplicada para modo Alto Contraste */
    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #000000;
      --text-color: #ffff00;
      --accent-color: #ffff00;
      --subtext-color: #ffffff;
      --border-color: #ffff00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 40px;
      font-size: calc(16px * var(--font-scale));
    }

    /* Barra de Acessibilidade no Topo */
    .accessibility-bar {
      background-color: #0d0d0d;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .accessibility-btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }

    .accessibility-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    header {
      background-color: var(--card-bg);
      text-align: center;
      padding: 2rem 1rem;
      border-bottom: 3px solid var(--accent-color);
    }

    header h1 {
      font-size: calc(2.5rem * var(--font-scale));
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    header p {
      color: var(--subtext-color);
      margin-top: 5px;
    }

    /* Painel de Controle e Interações */
    .controls-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .search-input {
      width: 100%;
      max-width: 500px;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    /* Botões de Categoria */
    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .filter-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    /* Contador de Resultados */
    .results-count {
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    /* Grid da Galeria */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 0 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-tag {
      display: inline-block;
      background-color: #2a2a2a;
      color: var(--accent-color);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    .card-title {
      font-size: calc(1.25rem * var(--font-scale));
      margin-bottom: 8px;
      color: var(--text-color);
    }

    .card-specs {
      font-size: calc(0.9rem * var(--font-scale));
      color: var(--subtext-color);
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .card-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: var(--accent-color);
      color: #fff;
      padding: 10px 0;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .card-btn:hover {
      background-color: #b20710;
    }
  </style>
</head>
<body>

  <!-- Barra Superior de Acessibilidade -->
  <nav class="accessibility-bar" aria-label="Menu de Acessibilidade">
    <button class="accessibility-btn" onclick="alterarFonte(0.1)" title="Aumentar Fonte">A+</button>
    <button class="accessibility-btn" onclick="alterarFonte(-0.1)" title="Diminuir Fonte">A-</button>
    <button class="accessibility-btn" onclick="resetarFonte()" title="Tamanho Padrão">A (Padrão)</button>
    <button class="accessibility-btn" onclick="toggleAltoContraste()" title="Alternar Alto Contraste">Alto Contraste</button>
    <button class="accessibility-btn" onclick="lerPagina()" title="Ouvir Conteúdo">🔊 Leitor de Voz</button>
  </nav>

  <header>
    <h1>AutoSport Blog</h1>
    <p>A coleção definitiva dos carros esportivos mais incríveis do mundo</p>
  </header>

  <div class="controls-container">
    <input type="text" id="searchInput" class="search-input" placeholder="Buscar modelo de carro..." oninput="filtrarGeral()">
    
    <div class="filter-buttons">
      <button class="filter-btn active" onclick="filtrarCategoria('todas', this)">Todas</button>
      <button class="filter-btn" onclick="filtrarCategoria('Superesportivo', this)">Superesportivos</button>
      <button class="filter-btn" onclick="filtrarCategoria('Muscle Car', this)">Muscle Cars</button>
      <button class="filter-btn" onclick="filtrarCategoria('JDM', this)">JDM</button>
    </div>

    <div class="results-count" id="resultsCount">Exibindo 200 de 200 carros</div>
  </div>

  <main class="gallery" id="carGallery"></main>

  <script>
    // --- LÓGICA DE ACESSIBILIDADE ---
    let escalaFonteAtual = 1;

    function alterarFonte(fator) {
      if ((escalaFonteAtual + fator >= 0.8) && (escalaFonteAtual + fator <= 1.5)) {
        escalaFonteAtual += fator;
        document.documentElement.style.setProperty('--font-scale', escalaFonteAtual);
      }
    }

    function resetarFonte() {
      escalaFonteAtual = 1;
      document.documentElement.style.setProperty('--font-scale', 1);
    }

    function toggleAltoContraste() {
      document.body.classList.toggle('high-contrast');
    }

    function lerPagina() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const texto = `Você está no AutoSport Blog. ${document.getElementById('resultsCount').textContent}.`;
        const utterance = new SpeechSynthesisUtterance(texto);
        utterance.lang = 'pt-BR';
        window.speechSynthesis.speak(utterance);
      } else {
        alert("A síntese de voz não é suportada neste navegador.");
      }
    }

    // --- DADOS E RENDEREZAÇÃO DA GALERIA ---
    const modelosBase = [
      { nome: "Ferrari F8 Tributo", potencia: "720 cv | 0-100 km/h: 2.9s", categoria: "Superesportivo", img: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=600&q=80" },
      { nome: "Ford Mustang GT", potencia: "488 cv | 0-100 km/h: 4.3s", categoria: "Muscle Car", img: "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?auto=format&fit=crop&w=600&q=80" },
      { nome: "Nissan GT-R R35", potencia: "570 cv | 0-100 km/h: 2.8s", categoria: "JDM", img: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=600&q=80" },
      { nome: "Porsche 911 GT3 RS", potencia: "525 cv | 0-100 km/h: 3.2s", categoria: "Superesportivo", img: "https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&w=600&q=80" },
      { nome: "Chevrolet Corvette C8", potencia: "502 cv | 0-100 km/h: 2.9s", categoria: "Muscle Car", img: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?auto=format&fit=crop&w=600&q=80" }
    ];

    function gerar200Carros() {
      const lista = [];
      for (let i = 1; i <= 200; i++) {
        const base = modelosBase[(i - 1) % modelosBase.length];
        lista.push({
          id: i,
          nome: `${base.nome} #${i}`,
          potencia: base.potencia,
          categoria: base.categoria,
          imagem: base.img
        });
      }
      return lista;
    }

    const todosOsCarros = gerar200Carros();
    let categoriaAtual = 'todas';

    function renderizarGaleria(dados) {
      const container = document.getElementById("carGallery");
      const countLabel = document.getElementById("resultsCount");
      
      container.innerHTML = "";
      countLabel.textContent = `Exibindo ${dados.length} de 200 carros`;

      if (dados.length === 0) {
        container.innerHTML = "<p style='grid-column: 1/-1; text-align: center; color: #777;'>Nenhum carro encontrado.</p>";
        return;
      }

      dados.forEach(carro => {
        const cardHTML = `
          <div class="card">
            <img src="${carro.imagem}" alt="${carro.nome}" loading="lazy">
            <div class="card-content">
              <span class="card-tag">${carro.categoria}</span>
              <h2 class="card-title">${carro.nome}</h2>
              <p class="card-specs">${carro.potencia}</p>
              <a href="#" class="card-btn">Ver Detalhes</a>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    function filtrarGeral() {
      const termo = document.getElementById("searchInput").value.toLowerCase();
      
      const resultado = todosOsCarros.filter(carro => {
        const atendeTexto = carro.nome.toLowerCase().includes(termo);
        const atendeCategoria = categoriaAtual === 'todas' || carro.categoria === categoriaAtual;
        return atendeTexto && atendeCategoria;
      });

      renderizarGaleria(resultado);
    }

    function filtrarCategoria(cat, elemento) {
      categoriaAtual = cat;
      document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
      elemento.classList.add('active');
      filtrarGeral();
    }

    renderizarGaleria(todosOsCarros);
  </script>
</body>
</html>

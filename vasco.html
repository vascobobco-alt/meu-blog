<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garagem de Carros Esportivos Avançada</title>
    <style>
        /* --- CONFIGURAÇÃO DE TEMAS (VARIÁVEIS CSS) --- */
        :root {
            --bg-color: #f4f4f9;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #d32f2f;
            --border-color: #cccccc;
            --table-stripe: #f9f9f9;
            --modal-overlay: rgba(0, 0, 0, 0.7);
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #ff5252;
            --border-color: #444444;
            --table-stripe: #2a2a2a;
            --modal-overlay: rgba(0, 0, 0, 0.85);
        }

        [data-theme="high-contrast"] {
            --bg-color: #000000;
            --panel-bg: #000000;
            --text-color: #ffff00;
            --primary-color: #ffffff;
            --border-color: #ffffff;
            --table-stripe: #000000;
            --modal-overlay: rgba(255, 255, 255, 0.2);
        }

        /* --- ESTILIZAÇÃO GERAL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 3px solid var(--primary-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        h1 {
            color: var(--primary-color);
        }

        /* --- BARRA DE ACESSIBILIDADE --- */
        .accessibility-menu {
            display: flex;
            gap: 10px;
        }

        .accessibility-menu button, .pagination button, .filter-section select {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 2px solid var(--primary-color);
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        .accessibility-menu button:focus, .pagination button:focus, .filter-section select:focus {
            outline: 3px solid var(--text-color);
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            max-width: 1100px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .controls-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            gap: 15px;
        }

        .stats {
            font-weight: bold;
            font-size: 1.1rem;
        }

        .filter-section select {
            font-size: 1rem;
            padding: 6px 12px;
        }

        /* --- TABELA COM IMAGENS --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            vertical-align: middle;
        }

        th {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        tr:nth-child(even) {
            background-color: var(--table-stripe);
        }

        .car-thumb {
            width: 100px;
            height: 60px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid var(--border-color);
            display: block;
            cursor: zoom-in;
        }

        [data-theme="high-contrast"] .car-thumb {
            border: 2px solid #ffffff;
        }

        /* --- PAGINAÇÃO --- */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        /* --- MODAL DA IMAGEM --- */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--modal-overlay);
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            max-width: 80%;
            max-height: 80%;
            border-radius: 8px;
            border: 3px solid var(--primary-color);
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .modal-close {
            position: absolute;
            top: 20px;
            right: 30px;
            color: #ffffff;
            font-size: 40px;
            font-weight: bold;
            cursor: pointer;
            background: none;
            border: none;
        }

        [data-theme="high-contrast"] .modal-close {
            color: #ffff00;
            background: #000000;
            padding: 5px 15px;
            border: 2px solid #ffffff;
        }

        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--panel-bg);
        }
    </style>
</head>
<body>

    <header role="banner">
        <h1>SuperCars Database</h1>
        <nav class="accessibility-menu" aria-label="Menu de Acessibilidade">
            <button onclick="setTheme('light')" aria-label="Tema Claro">☀️ Claro</button>
            <button onclick="setTheme('dark')" aria-label="Tema Escuro">🌙 Escuro</button>
            <button onclick="setTheme('high-contrast')" aria-label="Alto Contraste">👁️ Contraste</button>
        </nav>
    </header>

    <main class="container">
        
        <div class="controls-row">
            <div class="stats" id="car-count">Filtrando carros esportivos...</div>
            
            <!-- Filtro de Marcas -->
            <div class="filter-section">
                <label Sver for="brand-filter" style="margin-right: 8px; font-weight: bold;">Filtrar por Marca:</label>
                <select id="brand-filter" onchange="filterCars()">
                    <option value="all">Todas as Marcas</option>
                    <option value="Ferrari">Ferrari</option>
                    <option value="Lamborghini">Lamborghini</option>
                    <option value="Porsche">Porsche</option>
                    <option value="McLaren">McLaren</option>
                    <option value="Aston Martin">Aston Martin</option>
                </select>
            </div>
        </div>
        
        <table id="cars-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Foto (Clique p/ ampliar)</th>
                    <th>Modelo</th>
                    <th>Marca</th>
                    <th>Ano</th>
                    <th>Potência</th>
                </tr>
            </thead>
            <tbody id="cars-body">
                <!-- Inserido via JavaScript -->
            </tbody>
        </table>

        <div class="pagination">
            <button id="prev-btn" onclick="changePage(-1)">◀ Anterior</button>
            <span id="page-info">Página 1</span>
            <button id="next-btn" onclick="changePage(1)">Próxima ▶</button>
        </div>
    </main>

    <!-- Modal para visualização ampliada -->
    <div id="image-modal" class="modal" onclick="closeModal()">
        <button class="modal-close" onclick="closeModal()" aria-label="Fechar imagem">&times;</button>
        <img class="modal-content" id="modal-img" alt="Visualização ampliada do carro esportivo">
    </div>

    <footer>
        <p>&copy; 2026 SuperCars Dashboard - Filtros e zoom de imagens acessíveis.</p>
    </footer>

    <script>
        const catalogoMarcas = [
            { marca: "Ferrari", modelo: "Roma", img: "https://unsplash.com" },
            { marca: "Lamborghini", modelo: "Aventador", img: "https://unsplash.com" },
            { marca: "Porsche", modelo: "911 Turbo S", img: "https://unsplash.com" },
            { marca: "McLaren", modelo: "720S", img: "https://unsplash.com" },
            { marca: "Aston Martin", modelo: "Vantage", img: "https://unsplash.com" }
        ];

        const todosOsCarros = [];
        let carrosFiltrados = [];

        // Gerar 2000 carros
        for (let i = 1; i <= 2000; i++) {
            const base = catalogoMarcas[i % catalogoMarcas.length];
            const anoAleatorio = 2020 + (i % 7);
            const potenciaAleatoria = 550 + (i % 300);

            todosOsCarros.push({
                id: `#${String(i).padStart(4, '0')}`,
                marca: base.marca,
                modelo: `${base.modelo} Spec-${i}`,
                ano: anoAleatorio,
                potencia: potenciaAleatoria,
                foto: base.img
            });
        }

        // Inicializa a lista filtrada com todos os dados
        carrosFiltrados = [...todosOsCarros];

        // CONFIGURAÇÃO DE PAGINAÇÃO
        let currentPage = 1;
        const rowsPerPage = 10;

        function displayCars() {

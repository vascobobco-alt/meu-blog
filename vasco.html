<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Garagem de Carros Esportivos</title>
    <style>
        /* --- CONFIGURAÇÃO DE TEMAS (VARIÁVEIS CSS) --- */
        :root {
            --bg-color: #f4f4f9;
            --panel-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #d32f2f; /* Vermelho esportivo */
            --border-color: #cccccc;
            --table-stripe: #f9f9f9;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #ff5252;
            --border-color: #444444;
            --table-stripe: #2a2a2a;
        }

        [data-theme="high-contrast"] {
            --bg-color: #000000;
            --panel-bg: #000000;
            --text-color: #ffff00; /* Texto amarelo para alto contraste */
            --primary-color: #ffffff;
            --border-color: #ffffff;
            --table-stripe: #000000;
        }

        /* --- ESTILIZAÇÃO GERAL --- */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
            transition: background-color 0.2s, color 0.2s;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--panel-bg);
            border-bottom: 3px solid var(--primary-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
        }

        h1 {
            color: var(--primary-color);
        }

        /* --- BARRA DE ACESSIBILIDADE --- */
        .accessibility-menu {
            display: flex;
            gap: 10px;
        }

        .accessibility-menu button, .pagination button {
            background-color: var(--panel-bg);
            color: var(--text-color);
            border: 2px solid var(--primary-color);
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            border-radius: 4px;
        }

        .accessibility-menu button:focus, .pagination button:focus {
            outline: 3px solid var(--text-color);
        }

        /* --- CONTEÚDO PRINCIPAL --- */
        .container {
            max-width: 1000px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: var(--panel-bg);
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .stats {
            margin-bottom: 1rem;
            font-weight: bold;
            font-size: 1.1rem;
        }

        /* --- TABELA DE CARROS ACCESSÍVEL --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1rem;
        }

        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--primary-color);
            color: var(--bg-color);
        }

        tr:nth-child(even) {
            background-color: var(--table-stripe);
        }

        /* --- PAGINAÇÃO --- */
        .pagination {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 1rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            margin-top: 2rem;
            border-top: 1px solid var(--border-color);
            background-color: var(--panel-bg);
        }
    </style>
</head>
<body>

    <header role="banner">
        <h1>SuperCars Database</h1>
        <nav class="accessibility-menu" aria-label="Menu de Acessibilidade">
            <button onclick="setTheme('light')" aria-label="Tema Claro">☀️ Claro</button>
            <button onclick="setTheme('dark')" aria-label="Tema Escuro">🌙 Escuro</button>
            <button onclick="setTheme('high-contrast')" aria-label="Alto Contraste">👁️ Contraste</button>
        </nav>
    </header>

    <main class="container">
        <div class="stats" id="car-count">Carregando catálogo de esportivos...</div>
        
        <!-- Tabela onde os carros serão listados -->
        <table id="cars-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Modelo</th>
                    <th>Marca</th>
                    <th>Ano</th>
                    <th>Potência (cv)</th>
                </tr>
            </thead>
            <tbody id="cars-body">
                <!-- Inserido via JavaScript -->
            </tbody>
        </table>

        <!-- Controles de Paginação para não travar a tela -->
        <div class="pagination">
            <button id="prev-btn" onclick="changePage(-1)">◀ Anterior</button>
            <span id="page-info">Página 1</span>
            <button id="next-btn" onclick="changePage(1)">Próxima ▶</button>
        </div>
    </main>

    <footer>
        <p>&copy; 2026 SuperCars Dashboard - Acessibilidade em conformidade com WCAG.</p>
    </footer>

    <script>
        // 1. GERADOR DE DADOS (Simulando 2000 carros esportivos)
        const marcas = ["Ferrari", "Lamborghini", "Porsche", "McLaren", "Aston Martin", "Bugatti", "Audi", "BMW"];
        const modelos = ["Roma", "Aventador", "911 Turbo S", "720S", "Vantage", "Chiron", "R8 V10", "M8 Competition"];
        const carros = [];

        for (let i = 1; i <= 2000; i++) {
            const marcaAleatoria = marcas[i % marcas.length];
            const modeloAleatorio = modelos[i % modelos.length];
            const anoAleatorio = 2020 + (i % 7); // Anos entre 2020 e 2026
            const potenciaAleatoria = 500 + (i % 500); // Cavalos entre 500cv e 1000cv

            carros.push({
                id: `#${String(i).padStart(4, '0')}`,
                marca: marcaAleatoria,
                modelo: `${modeloAleatorio} GT-${i}`,
                ano: anoAleatorio,
                potencia: potenciaAleatoria
            });
        }

        // 2. LÓGICA DE PAGINAÇÃO
        let currentPage = 1;
        const rowsPerPage = 15; // Exibe 15 carros por vez para manter a leitura limpa

        function displayCars() {
            const tbody = document.getElementById('cars-body');
            tbody.innerHTML = "";

            const start = (currentPage - 1) * rowsPerPage;
            const end = start + rowsPerPage;
            const paginatedCars = carros.slice(start, end);

            paginatedCars.forEach(car => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td><strong>${car.id}</strong></td>
                    <td>${car.modelo}</td>
                    <td>${car.marca}</td>
                    <td>${car.ano}</td>
                    <td>${car.potencia} cv</td>
                `;
                tbody.appendChild(tr);
            });

            // Atualiza os textos da tela
            document.getElementById('car-count').innerText = `Total de Carros Esportivos Cadastrados: ${carros.length}`;
            document.getElementById('page-info').innerText = `Página ${currentPage} de ${Math.ceil(carros.length / rowsPerPage)}`;
            
            // Bloqueia botões se chegar nas pontas
            document.getElementById('prev-btn').disabled = currentPage === 1;
            document.getElementById('next-btn').disabled = end >= carros.length;
        }

        function changePage(direction) {
            currentPage += direction;
            displayCars();
        }

        // 3. ALTERNADOR DE TEMAS ACESSÍVEIS
        function setTheme(themeName) {
            document.documentElement.setAttribute('data-theme', themeName);
            localStorage.setItem('cars-theme', themeName);
        }

        // Inicialização automática
        window.onload = () => {
            const savedTheme = localStorage.getItem('cars-theme') || 'light';
            setTheme(savedTheme);
            displayCars();
        };
    </script>
</body>
</html>

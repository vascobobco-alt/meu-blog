<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoSport - Blog de Carros Esportivos</title>
  <style>
    /* Reset e Estilos Gerais */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #121212;
      color: #ffffff;
      padding-bottom: 40px;
    }

    /* Cabeçalho */
    header {
      background-color: #1e1e1e;
      text-align: center;
      padding: 2rem 1rem;
      border-bottom: 3px solid #e50914;
    }

    header h1 {
      font-size: 2.5rem;
      color: #e50914;
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    header p {
      color: #aaa;
      margin-top: 5px;
    }

    /* Campo de Busca */
    .search-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      text-align: center;
    }

    .search-container input {
      width: 100%;
      max-width: 500px;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid #333;
      background-color: #1e1e1e;
      color: #fff;
      font-size: 1rem;
      outline: none;
    }

    .search-container input:focus {
      border-color: #e50914;
    }

    /* Container dos Cards */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Estilo dos Cards */
    .card {
      background-color: #1e1e1e;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
      transition: transform 0.3s ease, box-shadow 0.3s ease;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
    }

    .card-title {
      font-size: 1.25rem;
      margin-bottom: 8px;
      color: #fff;
    }

    .card-specs {
      font-size: 0.9rem;
      color: #aaa;
      margin-bottom: 15px;
      line-height: 1.4;
    }

    .card-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: #e50914;
      color: #fff;
      padding: 10px 0;
      border-radius: 5px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.2s;
    }

    .card-btn:hover {
      background-color: #b20710;
    }
  </style>
</head>
<body>

  <header>
    <h1>AutoSport Blog</h1>
    <p>A coleção definitiva dos carros esportivos mais incríveis do mundo</p>
  </header>

  <div class="search-container">
    <input type="text" id="searchInput" placeholder="Buscar modelo de carro..." onkeyup="filtrarCarros()">
  </div>

  <main class="gallery" id="carGallery">
    <!-- Os 200 carros serão carregados dinamicamente via JS -->
  </main>

  <script>
    // Lista Base de Dados dos Carros (Expansível até 200 itens)
    const carros = [
      {
        id: 1,
        nome: "Ferrari F8 Tributo",
        potencia: "720 cv | 0-100 km/h: 2.9s",
        imagem: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 2,
        nome: "Porsche 911 GT3 RS",
        potencia: "525 cv | 0-100 km/h: 3.2s",
        imagem: "https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 3,
        nome: "Lamborghini Huracán EVO",
        potencia: "640 cv | 0-100 km/h: 2.9s",
        imagem: "https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 4,
        nome: "McLaren 720S",
        potencia: "720 cv | 0-100 km/h: 2.9s",
        imagem: "https://images.unsplash.com/photo-1621135802920-133df287f89c?auto=format&fit=crop&w=600&q=80"
      },
      {
        id: 5,
        nome: "Nissan GT-R Nismo",
        potencia: "600 cv | 0-100 km/h: 2.8s",
        imagem: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?auto=format&fit=crop&w=600&q=80"
      }
    ];

    // Função para preencher automaticamente a lista até atingir 200 carros de exemplo
    function gerar200Carros() {
      const listaCompleta = [];
      for (let i = 1; i <= 200; i++) {
        const carroBase = carros[(i - 1) % carros.length];
        listaCompleta.push({
          id: i,
          nome: `${carroBase.nome} #${i}`,
          potencia: carroBase.potencia,
          imagem: carroBase.imagem
        });
      }
      return listaCompleta;
    }

    const todosOsCarros = gerar200Carros();

    // Renderizar Cards no HTML
    function renderizarGaleria(dados) {
      const container = document.getElementById("carGallery");
      container.innerHTML = "";

      dados.forEach(carro => {
        const cardHTML = `
          <div class="card">
            <img src="${carro.imagem}" alt="${carro.nome}" loading="lazy">
            <div class="card-content">
              <h2 class="card-title">${carro.nome}</h2>
              <p class="card-specs">${carro.potencia}</p>
              <a href="#" class="card-btn">Ver Detalhes</a>
            </div>
          </div>
        `;
        container.innerHTML += cardHTML;
      });
    }

    // Filtro de Busca em Tempo Real
    function filtrarCarros() {
      const termo = document.getElementById("searchInput").value.toLowerCase();
      const resultado = todosOsCarros.filter(carro => 
        carro.nome.toLowerCase().includes(termo)
      );
      renderizarGaleria(resultado);
    }

    // Inicializa a página com os 200 cards
    renderizarGaleria(todosOsCarros);
  </script>
</body>
</html>

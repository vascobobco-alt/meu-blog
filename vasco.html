<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPM Blog - Esportivos e Clássicos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            background-color: #1a1a1a;
            border-bottom: 3px solid #ff0000;
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .search-box {
            max-width: 500px;
            margin: 0 auto 1rem auto;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 20px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: #ff0000;
        }

        .brand-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            max-width: 1100px;
            margin: 0 auto;
        }

        .filter-btn {
            background-color: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: #ff0000;
            color: #fff;
            border-color: #ff0000;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .stats {
            margin-bottom: 1.5rem;
            color: #888;
            font-size: 0.9rem;
        }

        .grid-cars {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .car-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            transform: translateY(-4px);
            border-color: #ff0000;
        }

        .car-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2a2a2a;
        }

        .car-content {
            padding: 1rem;
        }

        .car-category {
            background-color: #ff0000;
            color: #fff;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .car-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: #1a1a1a;
            color: #777;
            margin-top: 3rem;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">RPM Blog - Esportivos e Clássicos</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar modelo (ex: Chevette, Gol GTi, Ferrari)..." onkeyup="filterCars()">
        </div>
        <div class="brand-filters" id="brandFilters">
            <button class="filter-btn active" onclick="selectBrand('todas')">Todas</button>
        </div>
    </header>

    <div class="container">
        <div class="stats" id="carCount">Exibindo carros...</div>
        <div class="grid-cars" id="carGrid"></div>
    </div>

    <footer>
        <p>&copy; 2026 RPM Blog - Todos os direitos reservados</p>
    </footer>

    <script>
        // Mapeamento com imagens específicas para cada carro
        const listaCarros = [
            // Chevrolet
            { marca: "Chevrolet", modelo: "Chevette Hatch", img: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600&auto=format&fit=crop" },
            { marca: "Chevrolet", modelo: "Chevette Tubarão", img: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=600&auto=format&fit=crop" },
            { marca: "Chevrolet", modelo: "Opala SS", img: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=600&auto=format&fit=crop" },
            { marca: "Chevrolet", modelo: "Corvette C8", img: "https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=600&auto=format&fit=crop" },
            { marca: "Chevrolet", modelo: "Camaro ZL1", img: "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?w=600&auto=format&fit=crop" },
            
            // Volkswagen
            { marca: "Volkswagen", modelo: "Gol GTi 2.0", img: "https://images.unsplash.com/photo-1541348263662-e082662d82da?w=600&auto=format&fit=crop" },
            { marca: "Volkswagen", modelo: "SP2", img: "https://images.unsplash.com/photo-1503376780353-7e6692767b70?w=600&auto=format&fit=crop" },
            { marca: "Volkswagen", modelo: "Golf GTI", img: "https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=600&auto=format&fit=crop" },
            
            // Fiat
            { marca: "Fiat", modelo: "Uno Turbo IE", img: "https://images.unsplash.com/photo-1549399542-7e3f8b79c341?w=600&auto=format&fit=crop" },
            { marca: "Fiat", modelo: "Marea Turbo", img: "https://images.unsplash.com/photo-1605559424843-9e4c228bf1c2?w=600&auto=format&fit=crop" },
            
            // Ford
            { marca: "Ford", modelo: "Escort XR3", img: "https://images.unsplash.com/photo-1511919884226-fd3cad34687c?w=600&auto=format&fit=crop" },
            { marca: "Ford", modelo: "Maverick GT", img: "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?w=600&auto=format&fit=crop" },
            { marca: "Ford", modelo: "Mustang Shelby GT500", img: "https://images.unsplash.com/photo-1584345604476-8ec5e12e42dd?w=600&auto=format&fit=crop" },

            // Supercarros
            { marca: "Ferrari", modelo: "SF90 Stradale", img: "https://images.unsplash.com/photo-1583121274602-3e2820c69888?w=600&auto=format&fit=crop" },
            { marca: "Ferrari", modelo: "F40", img: "https://images.unsplash.com/photo-1617814076367-b759c7d7e738?w=600&auto=format&fit=crop" },
            { marca: "Porsche", modelo: "911 GT3 RS", img: "https://images.unsplash.com/photo-1614162692292-7ac56d7f7f1e?w=600&auto=format&fit=crop" },
            { marca: "Lamborghini", modelo: "Aventador SVJ", img: "https://images.unsplash.com/photo-1519245659620-e859806a8d3b?w=600&auto=format&fit=crop" },
            { marca: "Nissan", modelo: "Skyline GT-R R34", img: "https://images.unsplash.com/photo-1611244420853-70b2f831f0a2?w=600&auto=format&fit=crop" },
            { marca: "Toyota", modelo: "Supra MK4", img: "https://images.unsplash.com/photo-1603584173870-7f23fdae1b7a?w=600&auto=format&fit=crop" }
        ];

        let selectedBrand = 'todas';

        // Cria os botões de marcas no topo dinamicamente
        const marcasUnicas = [...new Set(listaCarros.map(c => c.marca))];
        marcasUnicas.forEach(marca => {
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.innerText = marca;
            btn.onclick = () => selectBrand(marca);
            document.getElementById('brandFilters').appendChild(btn);
        });

        function displayCars(cars) {
            const grid = document.getElementById('carGrid');
            const count = document.getElementById('carCount');
            
            grid.innerHTML = '';
            count.innerText = `Exibindo ${cars.length} de ${listaCarros.length} carros no catálogo`;

            cars.forEach(car => {
                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `
                    <img class="car-img" src="${car.img}" alt="${car.marca} ${car.modelo}" loading="lazy">
                    <div class="car-content">
                        <span class="car-category">${car.marca}</span>
                        <div class="car-title">${car.marca} ${car.modelo}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectBrand(marca) {
            selectedBrand = marca;
            
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === marca.toLowerCase() || (marca === 'todas' && btn.innerText === 'Todas'));
            });

            filterCars();
        }

        function filterCars() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = listaCarros.filter(car => {
                const nomeCompleto = `${car.marca} ${car.modelo}`.toLowerCase();
                const matchesSearch = nomeCompleto.includes(query);
                const matchesBrand = selectedBrand === 'todas' || car.marca.toLowerCase() === selectedBrand.toLowerCase();
                return matchesSearch && matchesBrand;
            });
            displayCars(filtered);
        }

        displayCars(listaCarros);
    </script>

</body>
</html>

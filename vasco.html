<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Primeiro Site</title>
    <style>
        /* Estilos CSS simples para a página */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #1a1a2e;
            color: #ffffff;
            padding: 1.5rem;
            text-align: center;
        }

        main {
            max-width: 800px;
            margin: 2rem auto;
            padding: 1rem;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        button {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            background-color: #0056b3;
        }

        footer {
            text-align: center;
            padding: 1rem;
            color: #777;
            margin-top: 2rem;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bem-vindo ao Meu Site!</h1>
    </header>

    <main>
        <h2>Subtítulo da Página</h2>
        <p>Este é um parágrafo simples em HTML. Você pode adicionar informações, imagens e links aqui.</p>
        
        <button onclick="mensagem()">Clique Aqui</button>
    </main>

    <footer>
        <p>&copy; 2026 - Criado por mim</p>
    </footer>

    <script>
        // Código JavaScript simples para interatividade
        function mensagem() {
            alert('Olá! Você clicou no botão.');
        }
    </script>

</body>
</html>

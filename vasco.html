<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AutoSport - Blog de Carros Esportivos</title>
  <style>
    :root {
      /* Tema Escuro Padrão */
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #ffffff;
      --accent-color: #e50914;
      --subtext-color: #aaa;
      --border-color: #333;
      --font-scale: 1;
    }

    /* Novo Tema Claro */
    body.light-theme {
      --bg-color: #f5f5f5;
      --card-bg: #ffffff;
      --text-color: #121212;
      --subtext-color: #555555;
      --border-color: #cccccc;
    }

    /* Alto Contraste (Sempre tem prioridade) */
    body.high-contrast {
      --bg-color: #000000;
      --card-bg: #000000;
      --text-color: #ffff00;
      --accent-color: #ffff00;
      --subtext-color: #ffffff;
      --border-color: #ffff00;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      padding-bottom: 40px;
      font-size: calc(16px * var(--font-scale));
      transition: background-color 0.3s, color 0.3s;
    }

    /* Barra de Acessibilidade */
    .accessibility-bar {
      background-color: #0d0d0d;
      border-bottom: 1px solid var(--border-color);
      padding: 8px 16px;
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Garante que a barra continue legível no tema claro */
    body.light-theme .accessibility-bar {
      background-color: #e0e0e0;
    }
    body.high-contrast .accessibility-bar {
      background-color: #000000;
    }

    .accessibility-btn {
      background: #2a2a2a;
      color: #fff;
      border: 1px solid #444;
      padding: 4px 10px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: background-color 0.2s, color 0.2s;
    }

    body.light-theme .accessibility-btn {
      background: #ffffff;
      color: #333;
      border: 1px solid #bbb;
    }

    .accessibility-btn:hover {
      background-color: var(--accent-color);
      color: #000;
    }
    
    body.light-theme .accessibility-btn:hover {
      background-color: var(--accent-color);
      color: #fff;
    }

    header {
      background-color: var(--card-bg);
      text-align: center;
      padding: 2rem 1rem;
      border-bottom: 3px solid var(--accent-color);
      transition: background-color 0.3s;
    }

    header h1 {
      font-size: calc(2.5rem * var(--font-scale));
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    header p {
      color: var(--subtext-color);
      margin-top: 5px;
    }

    /* Painel de Controle */
    .controls-container {
      max-width: 1200px;
      margin: 20px auto;
      padding: 0 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    .search-input {
      width: 100%;
      max-width: 500px;
      padding: 12px 20px;
      border-radius: 25px;
      border: 1px solid var(--border-color);
      background-color: var(--card-bg);
      color: var(--text-color);
      font-size: 1rem;
      outline: none;
      transition: background-color 0.3s, color 0.3s;
    }

    .search-input:focus {
      border-color: var(--accent-color);
    }

    .filter-buttons {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }

    .filter-btn {
      background-color: var(--card-bg);
      color: var(--text-color);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .filter-btn:hover, .filter-btn.active {
      background-color: var(--accent-color);
      border-color: var(--accent-color);
      color: #fff;
    }

    body.high-contrast .filter-btn.active {
      color: #000;
    }

    .results-count {
      color: var(--subtext-color);
      font-size: 0.9rem;
    }

    /* Galeria */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1200px;
      margin: 20px auto 0;
      padding: 0 20px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
      transition: transform 0.3s ease, box-shadow 0.3s ease, background-color 0.3s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 8px 20px rgba(229, 9, 20, 0.3);
    }

    .card img {
      width: 100%;
      height: 180px;
      object-fit: cover;
    }

    .card-content {
      padding: 15px;
      display: flex;
      flex-direction: column;
      flex-grow: 1;
    }

    .card-tag {
      display: inline-block;
      align-self: flex-start;
      background-color: #2a2a2a;
      color: var(--accent-color);
      font-size: 0.75rem;
      font-weight: bold;
      padding: 3px 8px;
      border-radius: 4px;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    
    body.light-theme .card-tag {
      background-color: #e0e0e0;
    }

    .card-title {
      font-size: calc(1.25rem * var(--font-scale));
      margin-bottom: 8px;
      color: var(--text-color);
    }

    .card-specs {
      font-size: calc(0.9rem * var(--font-scale));
      color: var(--subtext-color);
      margin-bottom: 15px;
      line-height: 1.4;
      flex-grow: 1;
    }

    .card-btn {
      display: inline-block;
      width: 100%;
      text-align: center;
      background-color: var(--accent-color);
      color: #fff;
      padding: 10px 0;
      border-radius: 5px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .card-btn:hover {
      background-color: #b20710;
    }

    body.high-contrast .card-btn {
      color: #000;
    }

    /* Modal de Detalhes */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal-content {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      max-width: 500px;
      width: 100%;
      overflow: hidden;
      position: relative;
    }

    .modal-content img {
      width: 100%;
      height: 250px;
      object-fit: cover;
    }

    .modal-body {
      padding: 20px;
    }

    .modal-close {
      position: absolute;
      top: 10px;
      right: 15px;
      background: rgba(0,0,0,0.7);
      color: #fff;
      border: none;
      font-size: 1.5rem;
      width: 35px;
      height: 35px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Barra Superior de Acessibilidade -->

    <button class="accessibility-btn" onclick="alterarFonte(-0.1)" title="Diminuir Fonte">A-</button>
    <button class="accessibility-btn" onclick="resetarFonte()" title="Tamanho Padrão">A (Padrão)</button>
    <button class="accessibility-btn" id="themeToggleBtn" onclick="toggleTema()" title="Alternar Tema Claro/Escuro">☀️ Modo Claro</button>
    <button class="accessibility-btn" onclick="toggleAltoContraste()" title="Alternar Alto Contraste">Alto Contraste</button>
    <button class="accessibility-btn" onclick="lerPagina()" title="Ouvir Conteúdo">🔊 Leitor de Voz</button>
  </nav>

  <header>
    <h1>AutoSport Blog</h1>
    <p>A coleção definitiva dos carros esportivos mais incríveis do mundo</p>
  </header>

  <div class="controls-container">

    </div>

    <div class="results-count" id="resultsCount">Exibindo 0 de 0 carros</div>
  </div>

  <main class="gallery" id="carGallery"></main>

  <!-- Janela Modal de Interação -->
  <div class="modal-overlay" id="carModal" onclick="fecharModal(event)">

      <button class="modal-close" onclick="fecharModalForcado()">&times;</button>

        <span class="card-tag" id="modalTag"></span>

        <p class="card-specs" id="modalSpecs"></p>
        <p style="color: var(--subtext-color); margin-top: 10px;">
          Este modelo faz parte da coleção oficial do AutoSport Blog. Entre em contato com nossos editores para obter a ficha técnica completa e materiais exclusivos de alta resolução.
        </p>
      </div>
    </div>
  </div>

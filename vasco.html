<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RPM Blog - Catalogo de Esportivos</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Roboto, sans-serif;
        }

        body {
            background-color: #121212;
            color: #ffffff;
            line-height: 1.6;
        }

        header {
            background-color: #1a1a1a;
            border-bottom: 3px solid #ff0000;
            padding: 1.5rem 2rem;
            text-align: center;
        }

        .logo {
            font-size: 2rem;
            font-weight: bold;
            color: #ff0000;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
        }

        .search-box {
            max-width: 500px;
            margin: 0 auto 1rem auto;
        }

        .search-box input {
            width: 100%;
            padding: 0.8rem 1rem;
            border-radius: 20px;
            border: 1px solid #444;
            background-color: #2a2a2a;
            color: #fff;
            font-size: 1rem;
            outline: none;
        }

        .search-box input:focus {
            border-color: #ff0000;
        }

        .brand-filters {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }

        .filter-btn {
            background-color: #2a2a2a;
            color: #ccc;
            border: 1px solid #444;
            padding: 0.4rem 0.8rem;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s;
        }

        .filter-btn:hover, .filter-btn.active {
            background-color: #ff0000;
            color: #fff;
            border-color: #ff0000;
        }

        .container {
            max-width: 1200px;
            margin: 2rem auto;
            padding: 0 1rem;
        }

        .stats {
            margin-bottom: 1.5rem;
            color: #888;
            font-size: 0.9rem;
        }

        .grid-cars {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        .car-card {
            background-color: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            overflow: hidden;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
        }

        .car-card:hover {
            transform: translateY(-4px);
            border-color: #ff0000;
        }

        .car-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #2a2a2a;
        }

        .car-content {
            padding: 1rem;
        }

        .car-category {
            background-color: #ff0000;
            color: #fff;
            font-size: 0.7rem;
            font-weight: bold;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
            display: inline-block;
            margin-bottom: 0.5rem;
        }

        .car-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 0.3rem;
        }

        footer {
            text-align: center;
            padding: 2rem;
            background-color: #1a1a1a;
            color: #777;
            margin-top: 3rem;
            border-top: 1px solid #333;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">RPM Blog - Esportivos</div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Buscar modelo ou marca..." onkeyup="filterCars()">
        </div>
        <div class="brand-filters" id="brandFilters">
            <button class="filter-btn active" onclick="selectBrand('todas')">Todas</button>
        </div>
    </header>

    <div class="container">
        <div class="stats" id="carCount">Exibindo carros...</div>
        <div class="grid-cars" id="carGrid"></div>
    </div>

    <footer>
        <p>&copy; 2026 RPM Blog - Todos os direitos reservados</p>
    </footer>

    <script>
        const marcas = [
            { marca: "Ferrari", modelos: ["488 GTB", "F8 Tributo", "SF90 Stradale", "LaFerrari", "812 Superfast", "Roma", "Portofino", "Enzo", "F40", "F50", "250 GTO", "Daytona SP3"] },
            { marca: "Porsche", modelos: ["911 GT3 RS", "911 Turbo S", "718 Cayman GT4", "918 Spyder", "911 Carrera S", "911 GT2 RS", "Taycan Turbo S", "Carrera GT", "959", "718 Boxster Spyder"] },
            { marca: "Lamborghini", modelos: ["Aventador SVJ", "Huracán EVO", "Revuelto", "Sian", "Countach LPI 800-4", "Gallardo", "Murciélago", "Veneno", "Centenario", "Diablo", "Urus Performante"] },
            { marca: "McLaren", modelos: ["720S", "765LT", "P1", "Senna", "Artura", "GT", "Speedtail", "650S", "570S", "F1", "Elva", "750S"] },
            { marca: "Aston Martin", modelos: ["Vantage", "DB11", "DBS Superleggera", "Valkyrie", "Valhalla", "One-77", "DB5", "V12 Vantage", "DBX707"] },
            { marca: "Bugatti", modelos: ["Veyron", "Chiron", "Divo", "Centodieci", "Bolide", "Mistral", "EB110"] },
            { marca: "Chevrolet", modelos: ["Corvette C8 Stingray", "Corvette Z06", "Corvette ZR1", "Camaro ZL1", "Camaro SS"] },
            { marca: "Ford", modelos: ["GT", "Mustang Shelby GT500", "Mustang Dark Horse", "Mustang Mach 1"] },
            { marca: "Nissan", modelos: ["GT-R Nismo", "GT-R R35", "Skyline GT-R R34", "Skyline GT-R R33", "Skyline GT-R R32", "370Z", "Z Nismo", "300ZX"] },
            { marca: "Toyota", modelos: ["GR Supra", "GR Yaris", "GR86", "Supra MK4 (A80)", "2000GT", "Celica GT-Four"] },
            { marca: "BMW", modelos: ["M3 Competition", "M4 CSL", "M2 CS", "M5 CS", "M8 Competition", "Z4 M40i", "i8", "M1"] },
            { marca: "Mercedes-AMG", modelos: ["AMG GT Black Series", "AMG One", "AMG GT 63 S", "SL 63", "C 63 AMG S", "CLK GTR"] },
            { marca: "Audi", modelos: ["R8 V10 Performance", "RS6 Avant", "RS7 Sportback", "RS e-tron GT", "TT RS", "Quattro"] },
            { marca: "Koenigsegg", modelos: ["Jesko", "Regera", "Gemera", "Agera RS", "CC850", "One:1"] },
            { marca: "Pagani", modelos: ["Zonda R", "Huayra Roadster", "Utopia", "Huayra BC"] }
        ];

        let allCars = [];
        let selectedBrand = 'todas';

        // Preenche a lista com mais de 100 carros
        marcas.forEach(item => {
            // Cria botões de filtro
            const btn = document.createElement('button');
            btn.className = 'filter-btn';
            btn.innerText = item.marca;
            btn.onclick = () => selectBrand(item.marca);
            document.getElementById('brandFilters').appendChild(btn);

            item.modelos.forEach(modelo => {
                const queryName = encodeURIComponent(`${item.marca} ${modelo}`);
                allCars.push({
                    nome: `${item.marca} ${modelo}`,
                    categoria: item.marca,
                    img: `https://source.unsplash.com/600x400/?${queryName},sports-car`
                });
            });
        });

        function displayCars(cars) {
            const grid = document.getElementById('carGrid');
            const count = document.getElementById('carCount');
            
            grid.innerHTML = '';
            count.innerText = `Exibindo ${cars.length} de ${allCars.length} carros esportivos`;

            cars.forEach(car => {
                const card = document.createElement('div');
                card.className = 'car-card';
                card.innerHTML = `
                    <img class="car-img" src="${car.img}" alt="${car.nome}" loading="lazy" onerror="this.onerror=null;this.src='https://images.unsplash.com/photo-1544829099-b9a0c07fad1a?w=600&auto=format&fit=crop';">
                    <div class="car-content">
                        <span class="car-category">${car.categoria}</span>
                        <div class="car-title">${car.nome}</div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        function selectBrand(marca) {
            selectedBrand = marca;
            
            // Atualiza o estado dos botões
            const buttons = document.querySelectorAll('.filter-btn');
            buttons.forEach(btn => {
                btn.classList.toggle('active', btn.innerText.toLowerCase() === marca.toLowerCase() || (marca === 'todas' && btn.innerText === 'Todas'));
            });

            filterCars();
        }

        function filterCars() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allCars.filter(car => {
                const matchesSearch = car.nome.toLowerCase().includes(query) || car.categoria.toLowerCase().includes(query);
                const matchesBrand = selectedBrand === 'todas' || car.categoria.toLowerCase() === selectedBrand.toLowerCase();
                return matchesSearch && matchesBrand;
            });
            displayCars(filtered);
        }

        // Inicializa a exibição
        displayCars(allCars);
    </script>

</body>
</html>

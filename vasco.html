<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cantinho do Cinema</title>
    <style>
        :root {
            --bg-color: #0f0f13;
            --card-bg: #1c1c24;
            --primary-color: #ff3838;
            --text-color: #ffffff;
            --text-secondary: #b3b3b3;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding-bottom: 50px;
        }

        header {
            background: linear-gradient(180deg, rgba(0,0,0,0.8) 0%, rgba(0,0,0,0) 100%);
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5rem;
            color: var(--text-color);
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        header h1 span {
            color: var(--primary-color);
        }

        .search-container {
            margin: 20px auto;
            max-width: 500px;
            width: 90%;
        }

        .search-container input {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid #333;
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            font-size: 1rem;
            outline: none;
            transition: 0.3s;
        }

        .search-container input:focus {
            border-color: var(--primary-color);
            background-color: rgba(255, 255, 255, 0.15);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .movie-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 30px;
        }

        .movie-card {
            background-color: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 16px rgba(0,0,0,0.3);
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
            display: flex;
            flex-direction: column;
        }

        .movie-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 20px rgba(255, 56, 56, 0.2);
        }

        .movie-poster {
            width: 100%;
            height: 350px;
            background-color: #2a2a36;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: var(--text-secondary);
            text-align: center;
            padding: 20px;
            border-bottom: 3px solid var(--primary-color);
            background-size: cover;
            background-position: center;
        }

        .movie-info {
            padding: 20px;
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .movie-title {
            font-size: 1.2rem;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .movie-meta {
            font-size: 0.9rem;
            color: var(--text-secondary);
            display: flex;
            justify-content: space-between;
        }

        .rating {
            color: #ffb830;
            font-weight: bold;
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            max-width: 600px;
            width: 90%;
            position: relative;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: 0.2s;
        }

        .close-btn:hover {
            color: var(--primary-color);
        }

        .modal-title {
            font-size: 1.8rem;
            margin-bottom: 15px;
            color: var(--text-color);
            border-bottom: 2px solid var(--primary-color);
            padding-bottom: 10px;
        }

        .modal-synopsis {
            color: var(--text-secondary);
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .modal-details {
            font-size: 0.95rem;
        }

        .modal-details p {
            margin-bottom: 8px;
        }

        .modal-details strong {
            color: var(--primary-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>Cantinho do <span>Cinema</span></h1>
        <p>Os filmes mais assistidos e populares do momento</p>
        <div class="search-container">
            <input type="text" id="searchInput" placeholder="Pesquisar filme...">
        </div>
    </header>

    <div class="container">
        <div class="movie-grid" id="movieGrid">
            <!-- Os filmes serão injetados aqui via JavaScript -->
        </div>
    </div>

    <!-- Estrutura do Modal -->
    <div class="modal" id="movieModal">
        <div class="modal-content">
            <span class="close-btn" id="closeModal">&times;</span>
            <h2 class="modal-title" id="modalTitle">Título do Filme</h2>
            <p class="modal-synopsis" id="modalSynopsis">Sinopse aqui...</p>
            <div class="modal-details" id="modalDetails">
                <!-- Detalhes dinâmicos -->
            </div>
        </div>
    </div>

    <script>
        // Lista de filmes cadastrados
        const movies = [
            {
                title: "Homem-Aranha: Através do Aranhaverso",
                director: "Joaquim Dos Santos, Kemp Powers",
                genre: "Animação / Ação",
                rating: "8.7",
                year: "2023",
                synopsis: "Miles Morales é catapultado através do Multiverso, onde ele encontra uma equipe de Pessoas-Aranha encarregadas de proteger sua própria existência.",
                cast: "Shameik Moore, Hailee Steinfeld, Oscar Isaac"
            },
            {
                title: "Oppenheimer",
                director: "Christopher Nolan",
                genre: "Biografia / Drama",
                rating: "8.9",
                year: "2023",
                synopsis: "A história do físico americano J. Robert Oppenheimer, seu papel no Projeto Manhattan e o desenvolvimento da bomba atômica.",
                cast: "Cillian Murphy, Emily Blunt, Matt Damon, Robert Downey Jr."
            },
            {
                title: "Interstellar",
                director: "Christopher Nolan",
                genre: "Ficção Científica / Aventura",
                rating: "8.7",
                year: "2014",
                synopsis: "Uma equipe de exploradores viaja através de um buraco de minhoca no espaço na tentativa de garantir a sobrevivência da humanidade.",
                cast: "Matthew McConaughey, Anne Hathaway, Jessica Chastain"
            },
            {
                title: "Batman: O Cavaleiro das Trevas",
                director: "Christopher Nolan",
                genre: "Ação / Crime",
                rating: "9.0",
                year: "2008",
                synopsis: "Quando a ameaça conhecida como Coringa causa estragos em Gotham, Batman deve aceitar um dos maiores testes psicológicos e físicos para combater a injustiça.",
                cast: "Christian Bale, Heath Ledger, Aaron Eckhart"
            },
            {
                title: "Duna: Parte 2",
                director: "Denis Villeneuve",
                genre: "Ficção Científica / Aventura",
                rating: "8.6",
                year: "2024",
                synopsis: "Paul Atreides se une a Chani e aos Fremen enquanto busca vingança contra os conspiradores que destruíram sua família.",
                cast: "Timothée Chalamet, Zendaya, Rebecca Ferguson"
            },
            {
                title: "Matrix",
                director: "Lana Wachowski, Lilly Wachowski",
                genre: "Ficção Científica / Ação",
                rating: "8.7",
                year: "1999",
                synopsis: "Um jovem hacker descobre a verdade sobre a sua realidade e o seu papel na guerra contra seus controladores virtuais.",
                cast: "Keanu Reeves, Laurence Fishburne, Carrie-Anne Moss"
            }
        ];

        const movieGrid = document.getElementById('movieGrid');
        const searchInput = document.getElementById('searchInput');
        const modal = document.getElementById('movieModal');
        const closeModal = document.getElementById('closeModal');

        // Função para renderizar os filmes na tela
        function displayMovies(moviesToRender) {
            movieGrid.innerHTML = "";
            
            if(moviesToRender.length === 0) {
                movieGrid.innerHTML = `<p style="grid-column: 1/-1; text-align: center; color: var(--text-secondary);">Nenhum filme encontrado.</p>`;
                return;
            }

            moviesToRender.forEach(movie => {
                const card = document.createElement('div');
                card.classList.add('movie-card');
                
                card.innerHTML = `
                    <div class="movie-poster">
                        <span>${movie.title}</span>
                    </div>
                    <div class="movie-info">
                        <h3 class="movie-title">${movie.title}</h3>
                        <div class="movie-meta">
                            <span>${movie.year} • ${movie.genre}</span>
                            <span class="rating">★ ${movie.rating}</span>
                        </div>
                    </div>
                `;

                // Abre o modal ao clicar no card
                card.addEventListener('click', () => openModal(movie));
                movieGrid.appendChild(card);
            });
        }

        // Abrir modal com detalhes do filme
        function openModal(movie) {
            document.getElementById('modalTitle').textContent = movie.title;
            document.getElementById('modalSynopsis').textContent = movie.synopsis;
            document.getElementById('modalDetails').innerHTML = `
                <p><strong>Direção:</strong> ${movie.director}</p>
                <p><strong>Elenco:</strong> ${movie.cast}</p>
                <p><strong>Gênero:</strong> ${movie.genre}</p>
                <p><strong>Ano de Lançamento:</strong> ${movie.year}</p>
                <p><strong>Avaliação:</strong> ★ ${movie.rating} / 10</p>
            `;
            modal.classList.add('show');
        }

        // Fechar modal
        closeModal.addEventListener('click', () => {
            modal.classList.remove('show');
        });

        window.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('show');
            }
        });

        // Filtrar filmes pelo campo de busca
        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredMovies = movies.filter(movie => 
                movie.title.toLowerCase().includes(searchTerm) ||
                movie.genre.toLowerCase().includes(searchTerm) ||
                movie.director.toLowerCase().includes(searchTerm)
            );
            displayMovies(filteredMovies);
        });

        // Inicializar exibição
        displayMovies(movies);
    </script>
</body>
</html>
